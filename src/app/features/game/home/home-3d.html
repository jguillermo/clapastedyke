<div class="absolute inset-0">
  <!-- Lienzo 3D (solo si hay WebGL) -->
  @if (webglSupported()) {
    <canvas #canvas class="block w-full h-full" aria-hidden="true"></canvas>

    <!-- Globo del chef coach tras el flyIn -->
    @if (coachVisible()) {
      <p
        class="absolute top-12 left-4 right-4 mx-auto my-0 max-w-md px-5 py-4 bg-surface-card border border-border-subtle rounded-xl shadow-lg text-body text-base text-center"
        role="status"
      >
        {{ coachText }}
      </p>
    }
  } @else {
    <!-- Ruta accesible sin WebGL: el flujo se opera desde el dock -->
    <div class="flex flex-col gap-3 items-center justify-center h-full p-8 text-center text-body">
      <h1 class="text-h1">Tu cocina</h1>
      <p>Tu equipo no puede mostrar la cocina en 3D, pero puedes seguir igual desde abajo.</p>
    </div>
  }

  <!-- Fila superior: HUD de nivel + acceso a la cuenta.
       Mobile-first: los dos comparten fila y se reparten el ancho (el título se recorta antes de
       empujar nada), en vez de posicionarse cada uno por su lado y solaparse a 375px. La fila no
       captura el puntero para no robarle clics al canvas; sí lo hacen sus dos hijos. -->
  <div class="absolute top-4 inset-x-4 flex items-start justify-between gap-2 pointer-events-none">
    <!-- HUD mínimo (Nivel 0) -->
    <header
      class="pointer-events-auto flex min-w-0 items-center gap-3 px-4 py-2 bg-surface-card border border-border-subtle rounded-full shadow-md"
    >
      <span class="shrink-0 px-3 py-0.5 rounded-full bg-brand text-on-brand font-bold text-caption">
        Nivel 0
      </span>
      <span class="min-w-0 truncate font-display text-heading text-sm">
        El libro de recetas en blanco
      </span>
    </header>

    <!-- Cuenta de Google (copia de seguridad en Sheets). Solo el icono en móvil; el nombre
         accesible lo da `aria-label`, así que el enlace se lee igual sin el texto visible. -->
    <a
      class="pointer-events-auto inline-flex shrink-0 min-h-11 items-center gap-2 px-4 rounded-full bg-surface-card border border-border-subtle shadow-md font-body text-sm font-semibold text-body cursor-pointer transition duration-base ease-out hover:bg-surface-sunken focus-visible:outline-none focus-visible:shadow-focus motion-reduce:transition-none"
      routerLink="/cuenta"
      aria-label="Cuenta"
    >
      <migo-icon name="mat:settings" size="sm" />
      <span class="hidden sm:inline">Cuenta</span>
    </a>
  </div>

  <!-- Dock: ruta accesible, siempre operable.
       Mobile-first: se acota a los bordes del viewport (`inset-x-3` + `w-fit`, centrado con
       `mx-auto`) y ENVUELVE. Antes era `left-1/2 -translate-x-1/2` con el ancho del contenido,
       así que a 375px el dock salía del viewport (`x` negativo) en cuanto las etiquetas medían
       un pelo más — depende de las métricas de fuente del sistema. -->
  <nav
    class="absolute bottom-5 inset-x-3 mx-auto flex w-fit flex-wrap justify-center gap-2 p-2 sm:gap-3 sm:p-3 bg-surface-card border border-border-subtle rounded-2xl shadow-lg"
    aria-label="Estaciones de la cocina"
  >
    @for (item of stations; track item.station) {
      <button
        type="button"
        [class]="stationClasses(item.active)"
        [disabled]="!item.active"
        [attr.aria-disabled]="!item.active"
        (click)="handleStation(item.station)"
      >
        {{ item.label }}
        @if (!item.active) {
          <span class="text-caption" aria-label="se desbloquea más adelante">🔒</span>
        }
      </button>
    }
  </nav>

  <!-- Libro de recetas 3D a pantalla completa (overlay) -->
  @if (bookOpen()) {
    <app-recipe-book-3d (closed)="onRecipeBookClosed()" />
  }
</div>
