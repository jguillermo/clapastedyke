name: Preparar el entorno
description: >-
  Node + dependencias listas para usar. Restaura `node_modules` de la caché y solo ejecuta
  `npm ci` si no había caché. Opcionalmente deja listo el Chromium de Playwright.

inputs:
  node-version:
    description: Versión de Node.
    required: false
    default: '22'
  playwright:
    description: "'true' para dejar instalado el Chromium de Playwright (Storybook y E2E)."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # La caché de `node_modules` se consulta ANTES de `setup-node` a propósito: si acierta,
    # ni siquiera hace falta restaurar la caché de tarballs de npm (~/.npm) — no vamos a
    # instalar nada. La clave es el lockfile, así que un cambio de dependencias la invalida.
    - name: Restaurar node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        # `nm` = node_modules. Clave corta a propósito para no pasar de 100 columnas.
        key: nm-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Solo se restaura ~/.npm cuando de verdad vamos a instalar.
        cache: ${{ steps.node-modules.outputs.cache-hit == 'true' && '' || 'npm' }}

    - name: npm ci (solo si no había caché de node_modules)
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # Los navegadores viven en ~/.cache/ms-playwright, fuera de node_modules: caché aparte.
    - name: Restaurar los navegadores de Playwright
      if: inputs.playwright == 'true'
      id: playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Instalar Chromium + dependencias del sistema
      if: inputs.playwright == 'true' && steps.playwright.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # El binario ya está cacheado, pero las librerías del sistema (apt) no se cachean:
    # se reinstalan solas, que es mucho más rápido que volver a bajar el navegador.
    - name: Dependencias del sistema (Chromium ya cacheado)
      if: inputs.playwright == 'true' && steps.playwright.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
