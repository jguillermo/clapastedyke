name: Desplegar en GitHub Pages

# Cada push a `main` (merge de un pull request o push directo) dispara el deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build -- --base-href /clapastedyke/

      - name: Fallback SPA (404.html)
        run: cp dist/misaevol/browser/index.html dist/misaevol/browser/404.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/misaevol/browser

      # GitHub Pages falla de forma intermitente en el backend ("Deployment failed, try
      # again later"), sin causa en este workflow — ver actions/deploy-pages#406 y #418.
      # Reintentamos el propio step para no depender de un re-run manual.
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Reintentar publicación en GitHub Pages (fallo intermitente del backend)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Verificar publicación en GitHub Pages
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: exit 1
