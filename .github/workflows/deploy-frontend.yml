name: Desplegar el FRONTEND (Firebase Hosting)

# Despliegue MANUAL: se lanza desde Actions → Run workflow, eligiendo el ambiente y la rama.
# No hay disparador automático a propósito — la puerta de calidad es el CI del pull request
# (`CI OK (required)`), y publicar es una decisión, no un efecto secundario de mergear.
#
# SOLO EL FRONTEND. El backend (`api/`) tiene su propio workflow, `deploy-backend.yml`, y esa
# separación es deliberada: publicar la app y publicar la API son dos decisiones distintas, así que un
# cambio de maquetación no puede tirar el servicio de sesión ni al revés.
#
# > Cuando un cambio necesita las dos cosas, el ORDEN importa: primero el backend y después el
# > frontend. La app llama a `/api/auth/token` desde su arranque, así que publicar el front contra una
# > API vieja deja a todo el mundo desconectado hasta que la API suba.
#
# TODA LA EJECUCIÓN VIVE AQUÍ. El repositorio no tiene scripts de despliegue: lo que hace falta para
# publicar son los pasos de este fichero. Y un ambiente no se declara en el repositorio, se declara
# en su *environment* de GitHub — dos secrets y dos variables. Ver `deploy/README.md`.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente: el nombre de un environment de GitHub (dev, prod, …)'
        type: string
        required: true
        default: dev

permissions:
  contents: read

# Por ambiente: un deploy a prod no cancela ni espera a uno a dev.
concurrency:
  group: firebase-hosting-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Build y deploy · ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # El *environment* de GitHub del mismo nombre que el ambiente es lo que hace que `secrets.*` y
    # `vars.*` resuelvan a los de ESE proyecto de Firebase. Es también donde se configuran las
    # aprobaciones y las ramas permitidas.
    #
    # Un nombre mal escrito crea aquí un environment vacío: el primer paso lo caza y dice que le
    # falta `PROJECT_ID`, en vez de fallar más tarde con un error del CLI.
    environment:
      name: ${{ inputs.ambiente }}
      url: https://${{ vars.PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4

      # Misma preparación que el CI: reaprovecha la caché de `node_modules` que deja el
      # workflow de CI, así que aquí normalmente no se instala nada.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # Se comprueba TODO antes de compilar nada. Publicar a medias es peor que no publicar, y un
      # secret que falta es el fallo más frecuente al estrenar un ambiente.
      - name: Comprobar el environment
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          faltan=""
          [ -n "$PROJECT_ID" ]               || faltan="$faltan variable:PROJECT_ID"
          [ -n "$GOOGLE_OAUTH" ]             || faltan="$faltan secret:GOOGLE_OAUTH"
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || faltan="$faltan secret:FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$faltan" ]; then
            echo "::error::Al environment '$AMBIENTE' le falta:$faltan. Settings → Environments → $AMBIENTE (ver deploy/README.md)."
            exit 1
          fi
          echo "Ambiente **$AMBIENTE** → proyecto \`$PROJECT_ID\`" >> "$GITHUB_STEP_SUMMARY"

      # Sin `--base-href`: Firebase sirve desde la raíz del dominio y `src/index.html` ya trae
      # `<base href="/">`. Tampoco hace falta copiar `index.html` a `404.html` ni ningún rewrite de
      # SPA: la app enruta por fragmento (`/#/home`), así que la única ruta que pide al servidor es
      # `/`.
      #
      # El build es el MISMO para todos los ambientes. Lo que cambia viaja como marcadores dentro de
      # `config.json`, y se sustituye en el paso siguiente.
      - name: Build de producción
        run: npm run build

      # Aquí es donde un ambiente se vuelve ese ambiente. Los marcadores viven versionados en
      # `public/config.json`; esto los sustituye SOLO en el artefacto, así que el repositorio nunca
      # contiene un Client ID.
      - name: Sustituir los marcadores del artefacto
        env:
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          DEBUG: ${{ vars.DEBUG }}
        run: |
          CONFIG=deploy/dist/hosting/config.json
          CLIENT_ID="$(printf '%s' "$GOOGLE_OAUTH" | jq -er '.web.client_id')" || {
            echo "::error::El secret GOOGLE_OAUTH no es el JSON del cliente de Google (falta .web.client_id)."
            exit 1
          }

          sed -i "s|GOOGLE_OAUTH_CLIENT_ID|${CLIENT_ID}|g" "$CONFIG"
          # Con las comillas dentro del patrón: `debug` tiene que quedar como booleano JSON, no como
          # la cadena "true" — la app compara con `=== true`.
          sed -i "s|\"DEBUG\"|${DEBUG:-false}|g" "$CONFIG"

          # Un marcador que sobrevive es un despliegue mudo: la app se publicaría sin poder conectar
          # con Google y nadie se enteraría hasta que alguien lo intentara.
          if grep -q 'GOOGLE_OAUTH_CLIENT_ID\|"DEBUG"' "$CONFIG"; then
            echo "::error::Ha quedado un marcador sin sustituir en $CONFIG."
            exit 1
          fi
          echo "config.json del artefacto:"; cat "$CONFIG"

      # Fuera del árbol que se publica: `runner.temp` no está dentro del repo ni de `deploy/dist`.
      - name: Credenciales de la cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> "$GITHUB_ENV"

      # `cd deploy` y no `--config`: el CLI fija la raíz del proyecto en el directorio de su
      # `firebase.json`, y todas las rutas de ese fichero (`dist/hosting`, `dist/functions/auth`,
      # `firestore.rules`) son relativas a `deploy/`. Desde la raíz del repositorio, el deploy muere
      # con «… is outside of project directory».
      - name: Deploy a Firebase Hosting
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: |
          cd deploy
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$PROJECT_ID" \
            --non-interactive
