name: Desplegar el BACKEND (Cloud Functions)

# Despliegue MANUAL de la función de sesión. Se lanza desde Actions → Run workflow, eligiendo el
# ambiente y la rama. No hay disparador automático a propósito: la puerta de calidad es el CI del
# pull request, y publicar es una decisión.
#
# SOLO EL BACKEND — `firebase/functions`, la función que mantiene la sesión (`/api/auth/**`). El
# frontend tiene su propio workflow, `deploy-frontend.yml`. Publicar la app y publicar la función
# son dos decisiones distintas.
#
# > Cuando un cambio necesita las dos cosas, el ORDEN importa: primero el backend y después el
# > frontend, porque la app llama a `/api/auth/token` desde su arranque.
#
# QUÉ SE DESPLIEGA: la carpeta `firebase/functions` entera, que es un paquete npm independiente con
# su propio `package.json`, su propio ESLint y su propio `tsc`. Firebase la empaqueta desde el
# fuente y Cloud Build instala sus dependencias allí desde el lockfile: aquí no se copia nada a una
# carpeta `dist/`.
#
# Van con la función las **reglas de Firestore**, no con el hosting: protegen lo que la función
# guarda (las sesiones), así que su ciclo de vida es el del backend.
#
# TODA LA EJECUCIÓN VIVE AQUÍ. El repositorio no tiene scripts de despliegue. Los ambientes son los
# *environments* de GitHub — DOS SECRETS, y nada más.
#
# No hay variables de environment: el proyecto de Firebase NO se configura aparte, se lee del
# `project_id` de la propia cuenta de servicio. Un solo sitio que mantener, y es imposible desplegar
# en un proyecto distinto del de las credenciales con las que se despliega.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente: el nombre de un environment de GitHub (dev, prod, …)'
        type: string
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: firebase-functions-${{ inputs.ambiente }}
  cancel-in-progress: false

env:
  FUNCTIONS_DIR: firebase/functions

jobs:
  desplegar:
    name: Deploy · functions · ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      # Sin `./.github/actions/setup`: esa acción instala las dependencias de la app Angular, que la
      # función no comparte. Aquí solo hace falta Node y el `npm ci` del propio paquete.
      #
      # La versión es la que declara `firebase/functions/package.json` → `engines.node`, para
      # compilar con el mismo Node con el que se ejecutará en Cloud Functions.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      # Todo lo que puede faltar, comprobado ANTES de compilar ni publicar nada.
      - name: Comprobar el environment
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          faltan=""
          [ -n "$GOOGLE_OAUTH_CLIENT" ]      || faltan="$faltan secret:GOOGLE_OAUTH_CLIENT"
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || faltan="$faltan secret:FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$faltan" ]; then
            echo "::error::Al environment '$AMBIENTE' le falta:$faltan. Settings → Environments → $AMBIENTE."
            exit 1
          fi

          # El proyecto de Firebase NO se configura: es el de la cuenta de servicio con la que se
          # despliega. Se publica en `GITHUB_ENV` para el resto de pasos. No es un secreto.
          PROJECT_ID="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -er '.project_id')" || {
            echo "::error::El secret FIREBASE_SERVICE_ACCOUNT no es la clave JSON de una cuenta de servicio (falta .project_id)."
            exit 1
          }
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Backend (\`$FUNCTIONS_DIR\`) → ambiente **$AMBIENTE** → proyecto \`$PROJECT_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar
        run: npm --prefix "$FUNCTIONS_DIR" ci

      # Se compila AQUÍ y no solo en el `predeploy` de firebase.json para que un fallo de lint o de
      # tipos salga como un paso rojo con su propio log, antes de tocar credenciales ni proyecto.
      # (El `predeploy` vuelve a ejecutarlos: es idempotente y garantiza que un deploy hecho a mano
      # desde un portátil compile igual.)
      - name: Lint y build
        run: |
          npm --prefix "$FUNCTIONS_DIR" run lint
          npm --prefix "$FUNCTIONS_DIR" run build

      # Un codebase que no exporta ninguna función NO es un deploy vacío inofensivo: Firebase lo
      # interpreta como «borra todas las funciones de este codebase». `--non-interactive` lo frena
      # pidiendo `--force`, pero es mejor pararlo aquí, con un mensaje que diga qué pasa.
      - name: Comprobar que hay función que desplegar
        run: |
          ENTRY="$FUNCTIONS_DIR/lib/index.js"
          if [ ! -f "$ENTRY" ] || ! grep -q '^exports\.' "$ENTRY"; then
            echo "::error::$FUNCTIONS_DIR no exporta ninguna función (revisa $ENTRY). Desplegar así borraría las funciones que ya estén publicadas. El rewrite /api/auth/** de firebase/firebase.json espera una función llamada 'auth'."
            exit 1
          fi
          echo "Funciones exportadas:"; grep -o '^exports\.[A-Za-z0-9_]*' "$ENTRY" | sort -u

      # El mismo mecanismo que en el frontend: los marcadores viven versionados en
      # `firebase/functions/.env` y se sustituyen SOLO en la copia del runner, que es efímera.
      #
      # Las DOS mitades del cliente van aquí, incluido el `client_secret`. Se guarda como UN solo
      # secret (`GOOGLE_OAUTH_CLIENT`, el JSON entero que descarga Google) para que el `client_id`
      # de un cliente no pueda emparejarse nunca con el `client_secret` de otro — ese desajuste es
      # lo que Google contesta con un `invalid_client` sin explicación.
      #
      # `::add-mask::` es obligatorio: GitHub enmascara el secret ENTERO en los logs, pero no un
      # campo extraído de él, y este acaba escrito en un fichero.
      - name: Sustituir los marcadores de .env
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          ENV_FILE="$FUNCTIONS_DIR/.env"
          [ -f "$ENV_FILE" ] || {
            echo "::error::Falta $ENV_FILE. Es un fichero VERSIONADO con marcadores; no se genera."
            exit 1
          }
          CLIENT_ID="$(printf '%s' "$GOOGLE_OAUTH_CLIENT" | jq -er '.web.client_id')" || {
            echo "::error::El secret GOOGLE_OAUTH_CLIENT no es el JSON del cliente de Google (falta .web.client_id)."
            exit 1
          }
          CLIENT_SECRET="$(printf '%s' "$GOOGLE_OAUTH_CLIENT" | jq -er '.web.client_secret')" || {
            echo "::error::El secret GOOGLE_OAUTH_CLIENT no trae .web.client_secret."
            exit 1
          }
          echo "::add-mask::$CLIENT_SECRET"

          sed -i "s|^GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID$|GOOGLE_OAUTH_CLIENT_ID=${CLIENT_ID}|" "$ENV_FILE"
          sed -i "s|^GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET$|GOOGLE_OAUTH_CLIENT_SECRET=${CLIENT_SECRET}|" "$ENV_FILE"

          # Un marcador que sobrevive es una función que arranca sin poder hablar con Google.
          if grep -qE '^GOOGLE_OAUTH_CLIENT_(ID|SECRET)=GOOGLE_OAUTH_CLIENT_(ID|SECRET)$' "$ENV_FILE"; then
            echo "::error::Ha quedado un marcador sin sustituir en $ENV_FILE."
            exit 1
          fi
          # El fichero NO se imprime: lleva el client secret.
          echo "Marcadores sustituidos en $ENV_FILE."

      - name: Credenciales de la cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> "$GITHUB_ENV"

      # `cd firebase` y no `--config`: las rutas de `firebase/firebase.json` (`public`, `functions`,
      # `firestore.rules`) son relativas a esa carpeta.
      #
      # `--only functions,firestore:rules`: no toca Hosting. Publicar la app es la otra decisión.
      - name: Deploy de la función y las reglas de Firestore
        run: |
          cd firebase
          npx --yes firebase-tools@latest deploy \
            --only functions,firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive
