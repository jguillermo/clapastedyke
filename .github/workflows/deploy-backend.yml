name: Desplegar el BACKEND (Cloud Functions)

# Despliegue MANUAL y SEPARADO del frontend: se lanza desde Actions → Run workflow.
#
# SOLO EL BACKEND (`api/`). El frontend tiene su propio workflow, `deploy-frontend.yml`. Publicar la
# app y publicar la API son dos decisiones distintas, y por eso son dos ficheros: un cambio de
# maquetación no puede tirar el servicio de sesión, y arreglar el servicio de sesión no obliga a
# republicar el front.
#
# > Cuando un despliegue necesita las dos cosas, el ORDEN importa: primero este y después el
# > frontend, porque la app llama a `/api/auth/token` desde su arranque.
#
# Los ambientes NO se declaran aquí: se leen de `deploy/environments.json`, igual que en el
# workflow de hosting. Las funciones tampoco: son las carpetas de `api/`.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente: una clave de deploy/environments.json (dev, prod, …)'
        type: string
        required: true
        default: dev
      funcion:
        description: 'Función a desplegar: el nombre de una carpeta de api/ (auth, …)'
        type: string
        required: true
        default: auth

permissions:
  contents: read

# Por ambiente y función: desplegar `auth` en dev no espera a un despliegue de otra cosa en prod.
concurrency:
  group: firebase-api-${{ inputs.ambiente }}-${{ inputs.funcion }}
  cancel-in-progress: false

jobs:
  # Job aparte y SIN `environment:`, por el mismo motivo que en el workflow de hosting: GitHub crea al
  # vuelo cualquier environment que un job referencie, así que un nombre mal escrito dejaría sembrado
  # un environment fantasma antes de fallar.
  validar:
    name: Validar ambiente y función
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ambiente: ${{ steps.resolver.outputs.ambiente }}
      funcion: ${{ steps.resolver.outputs.funcion }}
      project-id: ${{ steps.resolver.outputs.project-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver ambiente y función
        id: resolver
        env:
          AMBIENTE_INPUT: ${{ inputs.ambiente }}
          FUNCION_INPUT: ${{ inputs.funcion }}
        run: |
          AMBIENTE="$(printf '%s' "$AMBIENTE_INPUT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          FUNCION="$(printf '%s' "$FUNCION_INPUT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          # El mismo script que el workflow de hosting: un solo sitio donde viven los ambientes.
          if ! project_id="$(./deploy/env.sh "$AMBIENTE" 2>&1)"; then
            echo "::error::$project_id"
            exit 1
          fi

          # Una función es una carpeta de `api/` con su propio paquete. Comprobarlo aquí
          # convierte una errata en un mensaje claro en vez de en un error del CLI de Firebase.
          if [ ! -f "api/$FUNCION/package.json" ]; then
            echo "::error::No existe la función '$FUNCION': falta api/$FUNCION/package.json. Las que hay: $(ls -d api/*/ 2>/dev/null | xargs -n1 basename | tr '\n' ' ')."
            exit 1
          fi

          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "funcion=$FUNCION" >> "$GITHUB_OUTPUT"
          echo "project-id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Función **$FUNCION** → ambiente **$AMBIENTE** → proyecto \`$project_id\`" >> "$GITHUB_STEP_SUMMARY"

  desplegar:
    name: Deploy · ${{ needs.validar.outputs.funcion }} · ${{ needs.validar.outputs.ambiente }}
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # El *environment* de GitHub del mismo nombre que el ambiente es lo que hace que `secrets.*`
    # resuelva a las credenciales de ESE proyecto de Firebase.
    environment:
      name: ${{ needs.validar.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      - name: Tests de la función
        run: npm --prefix "api/${{ needs.validar.outputs.funcion }}" ci && npm --prefix "api/${{ needs.validar.outputs.funcion }}" test

      # El mismo comando que en un portátil. Deja en `deploy/dist/functions/<fn>/` la función
      # compilada, su `package.json` y su `.env.<projectId>` con los parámetros públicos del
      # ambiente — todo dentro de `deploy/`, que es lo único que ve el despliegue.
      # El Client ID NO está en el repositorio: vive aquí, en el *environment* de GitHub, y de aquí
      # lo toma el build para escribirlo en el `config.json` del artefacto y en el `.env` de la
      # función. Un solo origen para las dos mitades, así que no pueden divergir.
      #
      # No es un secreto (viaja en cada petición del navegador); está como secret para que el
      # cliente de Google viva en UN solo sitio, junto a su client secret, y no repartido.
      - name: Build del backend
        env:
          AMBIENTE: ${{ needs.validar.outputs.ambiente }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            echo "::error::El environment '$AMBIENTE' no tiene el secret GOOGLE_OAUTH_CLIENT_ID. Sin él la función se despliega sin poder canjear el código y /exchange contesta 500."
            exit 1
          fi
          npm run build -- "$AMBIENTE" --only functions

      # Fuera del árbol del repositorio: `runner.temp` no está dentro de `api/`.
      - name: Credenciales de la cuenta de servicio
        env:
          AMBIENTE: ${{ needs.validar.outputs.ambiente }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::El environment '$AMBIENTE' no tiene el secret FIREBASE_SERVICE_ACCOUNT (manual/firebase-deploy.md, paso 4)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> "$GITHUB_ENV"

      # El client secret de OAuth vive en el *environment* de GitHub, junto a las credenciales de
      # despliegue, y de ahí lo pone este paso en Secret Manager, que es donde lo resuelve el
      # `defineSecret` de la función. Así montar un ambiente es elegirlo aquí: no hay ningún valor
      # que alguien tenga que subir a mano desde su portátil.
      #
      # Va por **stdin** (`--data-file -`) a propósito: pasarlo como argumento lo dejaría en la
      # línea de comandos, visible para cualquier proceso de la máquina.
      #
      # Cada ejecución crea una VERSIÓN nueva del secreto y el `defineSecret` apunta a la última;
      # las viejas se limpian de vez en cuando con `functions:secrets:prune`.
      - name: Client secret de OAuth en Secret Manager
        env:
          AMBIENTE: ${{ needs.validar.outputs.ambiente }}
          PROJECT_ID: ${{ needs.validar.outputs.project-id }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::El environment '$AMBIENTE' no tiene el secret GOOGLE_OAUTH_CLIENT_SECRET. Se obtiene con deploy/create-google-client-id.sh (ver deploy/README.md)."
            exit 1
          fi
          printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | npx --yes firebase-tools@latest \
            functions:secrets:set GOOGLE_OAUTH_CLIENT_SECRET \
            --project "$PROJECT_ID" \
            --data-file -

      # `--only functions:<codebase>` empaqueta y sube SOLO esa carpeta: las demás funciones ni se
      # recompilan ni se tocan. Es lo que hace que cada una sea un despliegue independiente.
      #
      # Las reglas de Firestore van con la API y no con el hosting: protegen lo que guarda la API.
      - name: Deploy de la función
        env:
          AMBIENTE: ${{ needs.validar.outputs.ambiente }}
          FUNCION: ${{ needs.validar.outputs.funcion }}
        run: ./deploy/deploy.sh "$AMBIENTE" --only "functions:$FUNCION,firestore:rules"
