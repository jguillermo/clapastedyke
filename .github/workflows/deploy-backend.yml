name: Desplegar el BACKEND (Cloud Functions)

# Despliegue MANUAL de UNA función. Se lanza desde Actions → Run workflow, eligiendo el ambiente, la
# función y la rama. No hay disparador automático a propósito: la puerta de calidad es el CI del pull
# request, y publicar es una decisión.
#
# SOLO EL BACKEND (`api/`). El frontend tiene su propio workflow, `deploy-frontend.yml`. Publicar la
# app y publicar la API son dos decisiones distintas.
#
# > Cuando un cambio necesita las dos cosas, el ORDEN importa: primero el backend y después el
# > frontend, porque la app llama a `/api/auth/token` desde su arranque.
#
# TODA LA EJECUCIÓN VIVE AQUÍ. El repositorio no tiene scripts de despliegue. Las funciones son las
# carpetas de `api/`; los ambientes son los *environments* de GitHub. Ver `deploy/README.md`.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente: el nombre de un environment de GitHub (dev, prod, …)'
        type: string
        required: true
        default: dev
      funcion:
        description: 'Función a desplegar: el nombre de una carpeta de api/ (auth, …)'
        type: string
        required: true
        default: auth

permissions:
  contents: read

concurrency:
  group: firebase-api-${{ inputs.ambiente }}-${{ inputs.funcion }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Deploy · ${{ inputs.funcion }} · ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # Todo lo que puede faltar, comprobado ANTES de compilar o de tocar Secret Manager.
      - name: Comprobar el environment y la función
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          FUNCION: ${{ inputs.funcion }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          faltan=""
          [ -n "$PROJECT_ID" ]               || faltan="$faltan variable:PROJECT_ID"
          [ -n "$GOOGLE_OAUTH" ]             || faltan="$faltan secret:GOOGLE_OAUTH"
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || faltan="$faltan secret:FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$faltan" ]; then
            echo "::error::Al environment '$AMBIENTE' le falta:$faltan. Settings → Environments → $AMBIENTE (ver deploy/README.md)."
            exit 1
          fi

          # Una función es una carpeta de `api/` con su propio paquete. Comprobarlo aquí convierte
          # una errata en un mensaje claro en vez de en un error del CLI de Firebase.
          if [ ! -f "api/$FUNCION/package.json" ]; then
            echo "::error::No existe la función '$FUNCION': falta api/$FUNCION/package.json. Las que hay: $(ls -d api/*/ 2>/dev/null | xargs -n1 basename | tr '\n' ' ')."
            exit 1
          fi
          echo "Función **$FUNCION** → ambiente **$AMBIENTE** → proyecto \`$PROJECT_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests de la función
        env:
          FUNCION: ${{ inputs.funcion }}
        run: npm --prefix "api/$FUNCION" ci && npm --prefix "api/$FUNCION" test

      # Se compila y se **copia** a `deploy/dist/`, que es lo único que ve el despliegue.
      #
      # `lib/` lleva DOS árboles, `lib/<fn>/` y `lib/_common/`, porque el tsconfig de la función usa
      # `rootDir: ".."`. No es un detalle: Firebase empaqueta solo la carpeta de la función, así que
      # sin `lib/_common/` un `require("../_common/http")` no encontraría nada en producción.
      #
      # `node_modules` NO se copia: lo instala Cloud Build desde el lockfile.
      - name: Build y empaquetado
        env:
          FUNCION: ${{ inputs.funcion }}
        run: |
          npm --prefix "api/$FUNCION" run build

          DEST="deploy/dist/functions/$FUNCION"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -R "api/$FUNCION/lib" "$DEST/lib"
          cp "api/$FUNCION/package.json" "api/$FUNCION/package-lock.json" "api/$FUNCION/.env" "$DEST/"

      # El mismo mecanismo que en el frontend: el marcador vive versionado en `api/<fn>/.env` y se
      # sustituye SOLO en la copia que viaja.
      - name: Sustituir los marcadores del artefacto
        env:
          FUNCION: ${{ inputs.funcion }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
        run: |
          ENV_FILE="deploy/dist/functions/$FUNCION/.env"
          CLIENT_ID="$(printf '%s' "$GOOGLE_OAUTH" | jq -er '.web.client_id')" || {
            echo "::error::El secret GOOGLE_OAUTH no es el JSON del cliente de Google (falta .web.client_id)."
            exit 1
          }

          sed -i "s|GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID|GOOGLE_OAUTH_CLIENT_ID=${CLIENT_ID}|g" "$ENV_FILE"

          if grep -q '^GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID$' "$ENV_FILE"; then
            echo "::error::Ha quedado el marcador sin sustituir en $ENV_FILE."
            exit 1
          fi

      - name: Credenciales de la cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> "$GITHUB_ENV"

      # El client secret NO viaja en el artefacto: la función lo resuelve en ejecución desde Secret
      # Manager (`defineSecret`). Este paso lo pone ahí, sacándolo del mismo JSON del cliente.
      #
      # Va por **stdin** (`--data-file -`) a propósito: como argumento quedaría en la línea de
      # comandos, visible para cualquier proceso de la máquina. Y `::add-mask::` es obligatorio:
      # GitHub enmascara el secret ENTERO en los logs, pero no un campo extraído de él.
      #
      # Cada ejecución crea una VERSIÓN nueva del secreto y el `defineSecret` apunta a la última;
      # las viejas se limpian de vez en cuando con `functions:secrets:prune`.
      - name: Client secret de OAuth en Secret Manager
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
        run: |
          CLIENT_SECRET="$(printf '%s' "$GOOGLE_OAUTH" | jq -er '.web.client_secret')" || {
            echo "::error::El secret GOOGLE_OAUTH no trae .web.client_secret."
            exit 1
          }
          echo "::add-mask::$CLIENT_SECRET"

          printf '%s' "$CLIENT_SECRET" | npx --yes firebase-tools@latest \
            functions:secrets:set GOOGLE_OAUTH_CLIENT_SECRET \
            --project "$PROJECT_ID" \
            --data-file -

      # `--only functions:<codebase>` empaqueta y sube SOLO esa carpeta: las demás funciones ni se
      # recompilan ni se tocan. Es lo que hace que cada una sea un despliegue independiente.
      #
      # Las reglas de Firestore van con la API y no con el hosting: protegen lo que guarda la API.
      #
      # `cd deploy` y no `--config`: las rutas de `deploy/firebase.json` son relativas a esa carpeta.
      - name: Deploy de la función
        env:
          FUNCION: ${{ inputs.funcion }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: |
          cd deploy
          npx --yes firebase-tools@latest deploy \
            --only "functions:$FUNCION,firestore:rules" \
            --project "$PROJECT_ID" \
            --non-interactive
