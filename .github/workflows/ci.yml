name: CI

# Puerta de calidad de cada Pull Request: TODO tiene que pasar para poder mergear.
# El job final `ci-ok` es el único que hay que marcar como *required status check* en la
# protección de rama (Settings → Branches → Require status checks): agrupa a los demás, así
# que añadir o quitar jobs aquí no obliga a tocar la configuración de GitHub.
#
# Forma del pipeline — se instala UNA vez y se reutiliza:
#
#   setup ─┬─ static (formato · lint · tipos)
#          ├─ unit
#          ├─ storybook
#          └─ build ── e2e (desktop · mobile)   → ci-ok
#
# `setup` es el único job que puede ejecutar `npm ci` y bajarse los navegadores de Playwright;
# deja ambas cosas en caché y el resto de jobs solo las restaura (ver .github/actions/setup).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Solo lectura del repo: este workflow verifica, no publica nada.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior (en `main` no se cancela).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 0. Instalación única — calienta las cachés que consumen todos los demás jobs.
  #    Antes cada job hacía su propio `npm ci` (4 instalaciones idénticas en
  #    paralelo) y tres de ellos se bajaban Chromium por separado.
  # ───────────────────────────────────────────────────────────────────────────
  setup:
    name: Instalar dependencias (una sola vez)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          playwright: 'true'

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Formato (Prettier) + lint (ESLint) + tipos
  #    Checks estáticos: rápidos y sin build, van juntos para fallar pronto.
  # ───────────────────────────────────────────────────────────────────────────
  static:
    name: Formato · lint · tipos
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Ya no hay guardián de configuración: no hay nada generado que pueda derivar. Los ficheros
      # que el despliegue necesita están VERSIONADOS con un marcador dentro, y sustituirlo es cosa
      # del pipeline de despliegue, no de este job.

      - name: Prettier (formato)
        run: npm run format:check

      - name: ESLint (Angular + a11y de plantillas + límites entre capas)
        run: npm run lint

      # Las PLANTILLAS de Angular no las chequea tsc: eso lo hace `ng build` en el job `build`.
      # Estos tres pasos cubren lo demás, cada uno con los tipos que le tocan.
      - name: TypeScript — app + stories
        run: npm run typecheck:src

      - name: TypeScript — specs unitarios
        run: npm run typecheck:spec

      # Los dos cerrojos que mantienen la suite E2E independiente de `src/`
      # (paths: {} y rootDir: "." en e2e/tsconfig.json).
      - name: TypeScript — suite E2E (independiente de src/)
        run: npm run typecheck:e2e

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Tests unitarios — solo dominio y casos de uso de core/ (vitest + jsdom)
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: Tests unitarios (core)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ng test
        run: npm run test:unit

  # ───────────────────────────────────────────────────────────────────────────
  # 2b. La función (`firebase/functions`) — un paquete npm independiente, con sus
  #     propias dependencias, su propio ESLint (estilo Google) y su propio `tsc`.
  #     Es lo que Firebase Hosting sirve en `/api/auth/**` y lo que mantiene la
  #     sesión viva.
  #
  #     El CI la VALIDA en cada PR aunque no la despliegue: publicarla es manual
  #     y va por `deploy-backend.yml`.
  # ───────────────────────────────────────────────────────────────────────────
  functions:
    name: Función (firebase/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sin `./.github/actions/setup`: esa acción instala las dependencias de la
      # app Angular, que la función no comparte. Aquí solo hace falta Node y su
      # propio `npm ci`, con la versión que declara su `engines.node`.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Instalar
        run: npm --prefix firebase/functions ci

      - name: ESLint
        run: npm --prefix firebase/functions run lint

      # `tsc` con el tsconfig de la función: es el mismo build que corre el
      # `predeploy` de firebase.json, así que un fallo aquí es un deploy que
      # habría fallado.
      - name: TypeScript (build)
        run: npm --prefix firebase/functions run build

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build de producción — incluye el type-check de plantillas de Angular y
  #    hace cumplir los budgets de tamaño declarados en angular.json.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build de producción
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Compila la app tal cual está en el repositorio: el `config.json` que viaja dentro lleva sus
      # MARCADORES, así que la integración de Google queda apagada y la suite prueba siempre lo
      # mismo, aquí y en un portátil. Los tests que necesitan Google instalan su propio doble.
      #
      # El backend no se compila aquí: los E2E prueban la app. Lo cubre el job `functions`.
      - name: ng build (production, con budgets)
        run: npm run build

      # Lo consume el job de E2E: la suite prueba el BUILD COMPILADO, no `ng serve`.
      # Sin comprimir: el artefacto vive un día y se descarga dos veces en la misma
      # corrida, así que comprimirlo cuesta más de lo que ahorra.
      - name: Subir el build para los E2E
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: firebase/public/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Storybook — el `play` de cada story es el test de estado/variante de los
  #    componentes del design system (incluye los checks de a11y del addon).
  # ───────────────────────────────────────────────────────────────────────────
  storybook:
    name: Stories del design system (play)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          playwright: 'true'

      - name: vitest --project=storybook
        run: npm run sb:test

  # ───────────────────────────────────────────────────────────────────────────
  # 5. E2E (Playwright) — flujos completos sobre las vistas de features/.
  #    Dos proyectos: `desktop` (1280px) y `mobile` (375px, regla mobile-first).
  #    Reutiliza el `dist/` del job de build en vez de recompilar.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          playwright: 'true'

      - name: Descargar el build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: firebase/public/

      # Sin `npm run test:e2e` a propósito: ese script vuelve a hacer `ng build`, y aquí el
      # build ya viene del job anterior. El type-check de la suite lo cubre el job `static`.
      - name: playwright test (${{ matrix.project }})
        run: npx playwright test --config e2e/playwright.config.ts --project=${{ matrix.project }}

      - name: Subir el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Puerta única — ESTE es el check requerido en la protección de rama.
  #    Falla si cualquiera de los anteriores falló, se canceló o se saltó.
  # ───────────────────────────────────────────────────────────────────────────
  ci-ok:
    name: CI OK (required)
    if: always()
    needs: [setup, static, unit, functions, build, storybook, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar el resultado de todos los jobs
        run: |
          echo "setup:     ${{ needs.setup.result }}"
          echo "static:    ${{ needs.static.result }}"
          echo "unit:      ${{ needs.unit.result }}"
          echo "functions: ${{ needs.functions.result }}"
          echo "build:     ${{ needs.build.result }}"
          echo "storybook: ${{ needs.storybook.result }}"
          echo "e2e:       ${{ needs.e2e.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Hay checks que no han pasado — el PR no se puede mergear."
            exit 1
          fi
          echo "Todos los checks han pasado."
