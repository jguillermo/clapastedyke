name: Desplegar (Firebase)

# Despliegue MANUAL y COMPLETO. Se lanza desde Actions → Run workflow, eligiendo el ambiente y la
# rama. No hay disparador automático a propósito: la puerta de calidad es el CI del pull request
# (`CI OK (required)`), y publicar es una decisión, no un efecto secundario de mergear.
#
# UN SOLO WORKFLOW Y UN SOLO COMANDO. `firebase deploy`, sin `--only`, publica los tres targets que
# declara `firebase/firebase.json` —`firestore`, `functions` y `hosting`— de una vez. No se elige
# qué se publica: **siempre se despliega todo**, así que la app y la función que le sirve
# `/api/auth/**` no pueden quedar desparejadas.
#
# Lo único que hay antes son los cuatro pasos que `firebase deploy` NO hace por ti:
#   1. compilar Angular  → `ng build` escribe en `firebase/public`, que ES `hosting.public`
#   2. instalar las dependencias de la función → sus `predeploy` (lint + tsc) corren EN EL RUNNER
#   3. sustituir los marcadores de `config.json` y `.env` por los valores del ambiente
#   4. dejar las credenciales y deducir el proyecto
#
# TODA LA EJECUCIÓN VIVE AQUÍ. El repositorio no tiene scripts de despliegue. Y un ambiente no se
# declara en el repositorio, se declara en su *environment* de GitHub — DOS SECRETS, y nada más.
# Ver `firebase/README.md`.
#
# No hay variables de environment: el proyecto de Firebase NO se configura aparte, se lee del
# `project_id` de la propia cuenta de servicio. Un solo sitio que mantener, y es imposible desplegar
# en un proyecto distinto del de las credenciales con las que se despliega.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente: el nombre de un environment de GitHub (dev, prod, …)'
        type: string
        required: true
        default: dev
      # `debug` es un input y no una variable del environment a propósito: publicar ya es una
      # decisión manual, así que se elige en el mismo formulario. `warn` y `error` se ven siempre;
      # esto solo enciende el detalle del flujo (`public/config.json` → `"debug"`).
      debug:
        description: '¿Publicar con el detalle del flujo visible en la consola?'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Por ambiente: un deploy a prod no cancela ni espera a uno a dev.
concurrency:
  group: firebase-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Deploy · ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # El *environment* de GitHub del mismo nombre que el ambiente es lo que hace que `secrets.*`
    # resuelva a los de ESE proyecto de Firebase. Es también donde se configuran las aprobaciones y
    # las ramas permitidas.
    #
    # Un nombre mal escrito crea aquí un environment vacío: el primer paso lo caza y dice qué secret
    # le falta, en vez de fallar más tarde con un error del CLI.
    environment:
      name: ${{ inputs.ambiente }}
      url: ${{ steps.ambiente.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Misma preparación que el CI: reaprovecha la caché de `node_modules` que deja el workflow de
      # CI, así que aquí normalmente no se instala nada.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'

      # Se comprueba TODO antes de compilar nada. Publicar a medias es peor que no publicar, y un
      # secret que falta es el fallo más frecuente al estrenar un ambiente.
      - name: Comprobar el environment
        id: ambiente
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          faltan=""
          [ -n "$GOOGLE_OAUTH_CLIENT" ]      || faltan="$faltan secret:GOOGLE_OAUTH_CLIENT"
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || faltan="$faltan secret:FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$faltan" ]; then
            echo "::error::Al environment '$AMBIENTE' le falta:$faltan. Settings → Environments → $AMBIENTE (ver firebase/README.md)."
            exit 1
          fi

          # El proyecto de Firebase NO se configura: es el de la cuenta de servicio con la que se
          # despliega. Se publica en `GITHUB_ENV` para el resto de pasos, y como salida para la URL
          # del environment. No es un secreto (va en la URL pública del sitio), así que no se enmascara.
          PROJECT_ID="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -er '.project_id')" || {
            echo "::error::El secret FIREBASE_SERVICE_ACCOUNT no es la clave JSON de una cuenta de servicio (falta .project_id)."
            exit 1
          }
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "url=https://$PROJECT_ID.web.app" >> "$GITHUB_OUTPUT"
          echo "Ambiente **$AMBIENTE** → proyecto \`$PROJECT_ID\`" >> "$GITHUB_STEP_SUMMARY"

      # 1 · Firebase no compila Angular. `outputPath` es `firebase/public` (angular.json), o sea la
      # carpeta que publica Hosting: no hay copia intermedia. El build es el MISMO para todos los
      # ambientes — lo que cambia viaja como marcadores dentro de `config.json`.
      #
      # Sin `--base-href`: Firebase sirve desde la raíz del dominio y `src/index.html` ya trae
      # `<base href="/">`. Tampoco hay rewrite de SPA en `firebase.json`: la app enruta por
      # fragmento (`/#/home`), así que la única ruta que pide al servidor es `/`.
      - name: Build de la app → firebase/public
        run: npm run build

      # 2 · La función es un paquete npm aparte. Este `npm ci` NO es opcional: los `predeploy` de
      # firebase.json son `npm --prefix … run lint/build` y corren EN EL RUNNER, dentro del propio
      # `firebase deploy`, antes de empaquetar. Compilarla aquí a mano sería repetir ese trabajo.
      - name: Dependencias de la función
        run: npm --prefix firebase/functions ci

      # 3 · Aquí es donde un ambiente se vuelve ese ambiente. Los marcadores viven versionados en
      # `public/config.json` y `firebase/functions/.env`; esto los sustituye solo en el runner, que
      # es efímero, así que el repositorio nunca contiene un Client ID.
      #
      # Las DOS mitades del cliente salen del MISMO secret (`GOOGLE_OAUTH_CLIENT`, el JSON entero
      # que descarga Google) para que el `client_id` de un cliente no pueda emparejarse nunca con el
      # `client_secret` de otro — ese desajuste es lo que Google contesta con un `invalid_client`
      # sin explicación.
      #
      # `::add-mask::` es obligatorio: GitHub enmascara el secret ENTERO en los logs, pero no un
      # campo extraído de él, y este acaba escrito en un fichero.
      - name: Sustituir los marcadores
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          DEBUG: ${{ inputs.debug }}
        run: |
          CONFIG=firebase/public/config.json
          ENV_FILE=firebase/functions/.env
          for f in "$CONFIG" "$ENV_FILE"; do
            [ -f "$f" ] || { echo "::error::No existe $f."; exit 1; }
          done

          CLIENT_ID="$(printf '%s' "$GOOGLE_OAUTH_CLIENT" | jq -er '.web.client_id')" || {
            echo "::error::El secret GOOGLE_OAUTH_CLIENT no es el JSON del cliente de Google (falta .web.client_id)."
            exit 1
          }
          CLIENT_SECRET="$(printf '%s' "$GOOGLE_OAUTH_CLIENT" | jq -er '.web.client_secret')" || {
            echo "::error::El secret GOOGLE_OAUTH_CLIENT no trae .web.client_secret."
            exit 1
          }
          echo "::add-mask::$CLIENT_SECRET"

          sed -i "s|GOOGLE_OAUTH_CLIENT_ID|${CLIENT_ID}|g" "$CONFIG"
          # Con las comillas dentro del patrón: `debug` tiene que quedar como booleano JSON, no como
          # la cadena "true" — la app compara con `=== true`.
          sed -i "s|\"DEBUG\"|${DEBUG:-false}|g" "$CONFIG"

          sed -i "s|^GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID$|GOOGLE_OAUTH_CLIENT_ID=${CLIENT_ID}|" "$ENV_FILE"
          sed -i "s|^GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET$|GOOGLE_OAUTH_CLIENT_SECRET=${CLIENT_SECRET}|" "$ENV_FILE"

          # Un marcador que sobrevive es un despliegue mudo: se publicaría sin poder conectar con
          # Google y nadie se enteraría hasta que alguien lo intentara.
          if grep -q 'GOOGLE_OAUTH_CLIENT_ID\|"DEBUG"' "$CONFIG" \
            || grep -qE '^GOOGLE_OAUTH_CLIENT_(ID|SECRET)=GOOGLE_OAUTH_CLIENT_(ID|SECRET)$' "$ENV_FILE"; then
            echo "::error::Ha quedado un marcador sin sustituir."
            exit 1
          fi

          # `config.json` se imprime porque no lleva secretos; el `.env` NO, que lleva el client secret.
          echo "config.json del artefacto:"; cat "$CONFIG"
          echo "Marcadores de $ENV_FILE sustituidos."

      # 4 · Fuera del árbol que se publica: `runner.temp` no está dentro del repo ni de `firebase/public`.
      - name: Credenciales de la cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> "$GITHUB_ENV"

      # ── Y ya. Un comando, sin `--only`: firestore + functions + hosting.
      #
      # `cd firebase` y no `--config`: el CLI fija la raíz del proyecto en el directorio de su
      # `firebase.json`, y todas las rutas de ese fichero (`public`, `functions`, `firestore.rules`)
      # son relativas a `firebase/`. Desde la raíz del repositorio, el deploy muere con
      # «… is outside of project directory».
      #
      # `--non-interactive` es además la red de seguridad: si el despliegue implicara BORRAR alguna
      # función ya publicada, el CLI se planta y pide `--force` en vez de hacerlo callando.
      - name: firebase deploy
        run: |
          cd firebase
          npx --yes firebase-tools@latest deploy \
            --project "$PROJECT_ID" \
            --non-interactive
